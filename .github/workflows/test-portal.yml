
name: Test OJO PisoWiFi Portal

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "opw/**"
      - "static/**"
      - "manage.py"
      - "requirements.txt"
      - ".github/workflows/test-portal.yml"
  pull_request:

permissions:
  contents: read

jobs:
  test-portal:
    name: Django portal tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libffi-dev \
            python3-dev \
            libjpeg-dev \
            zlib1g-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          pip install -r requirements.txt

      - name: Check Django configuration
        run: |
          python manage.py check

      - name: Apply database migrations
        run: |
          python manage.py migrate --noinput

      - name: Run project tests
        run: |
          python manage.py test

      - name: Smoke test portal homepage
        env:
          DJANGO_SETTINGS_MODULE: opw.settings
        run: |
          python - <<'PY'
          import os
          import django

          os.environ.setdefault(
              "DJANGO_SETTINGS_MODULE", "opw.settings"
          )
          django.setup()

          from django.test import Client, override_settings

          with override_settings(
              ALLOWED_HOSTS=[
                  "testserver",
                  "localhost",
                  "127.0.0.1",
              ]
          ):
              client = Client()
              response = client.get("/")

          print("Portal homepage HTTP status:",
                response.status_code)

          if response.status_code >= 500:
              raise SystemExit(
                  "FAIL: Portal returned a server error."
              )

          if response.status_code == 404:
              print(
                  "WARNING: Homepage route not found. "
                  "Check the project's URL configuration."
              )
          else:
              print("PASS: Homepage responded without a 5xx error.")
          PY
          
