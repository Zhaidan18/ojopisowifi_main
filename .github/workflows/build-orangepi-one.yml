
name: Build OJO PisoWiFi IMG - Orange Pi One

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-orangepi-one.yml"

permissions:
  contents: read

concurrency:
  group: orangepi-one-image
  cancel-in-progress: false

jobs:
  build:
    name: Build Armbian image
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout PisoWiFi source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget xz-utils zip unzip \
            qemu-user-static binfmt-support \
            debootstrap debian-archive-keyring \
            build-essential ca-certificates \
            python3 python3-yaml

      - name: Clone Armbian build framework
        run: |
          git clone --depth 1 \
            https://github.com/armbian/build.git \
            armbian-build

      - name: Configure Orange Pi One image
        working-directory: armbian-build
        run: |
          mkdir -p userpatches

          cat > userpatches/config-pisowifi.conf <<'EOF'
          BOARD="orangepione"
          BRANCH="current"
          RELEASE="trixie"
          BUILD_MINIMAL="yes"
          BUILD_DESKTOP="no"
          KERNEL_CONFIGURE="no"
          EOF

      - name: Build Armbian minimal image
        working-directory: armbian-build
        run: |
          ./compile.sh build \
            BOARD=orangepione \
            BRANCH=current \
            RELEASE=trixie \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            SHARE_LOGS=no

      - name: Locate generated image
        id: image
        run: |
          set -eu
          mkdir -p release

          IMAGE="$(find armbian-build/output/images \
            -maxdepth 1 -type f \
            \( -name '*.img' -o -name '*.img.xz' \) \
            | head -n 1)"

          if [ -z "$IMAGE" ]; then
            echo "Walang IMG na nabuo. Tingnan ang build logs."
            exit 1
          fi

          cp "$IMAGE" release/
          ls -lh release/

      - name: Upload flashable image
        uses: actions/upload-artifact@v4
        with:
          name: OJO-PisoWiFi-OrangePi-One-IMG
          path: release/*
          if-no-files-found: error
          retention-days: 7
          
