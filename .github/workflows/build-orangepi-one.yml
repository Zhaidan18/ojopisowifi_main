
name: Build OJO PisoWiFi - Orange Pi One

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "userpatches/**"
      - "gpio-coin/**"

permissions:
  contents: read

concurrency:
  group: ojopisowifi-orange-pi-one
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget jq \
            docker.io qemu-user-static \
            binfmt-support xz-utils \
            parted dosfstools e2fsprogs

      - name: Enable Docker
        run: |
          sudo systemctl start docker
          docker --version

      - name: Checkout Armbian build system
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          path: armbian-build
          ref: main

      - name: Copy customizations
        run: |
          mkdir -p armbian-build/userpatches
          cp userpatches/config-pisowifi.conf \
            armbian-build/userpatches/
          cp userpatches/customize-image.sh \
            armbian-build/userpatches/

          mkdir -p armbian-build/userpatches/overlay/opt/pisowifi
          cp gpio-coin/coin_acceptor.py \
            armbian-build/userpatches/overlay/opt/pisowifi/

      - name: Build Orange Pi One OS
        working-directory: armbian-build
        run: |
          ./compile.sh build \
            BOARD=orangepione \
            BRANCH=current \
            RELEASE=trixie \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=no

      - name: Find and validate image
        run: |
          set -eu
          mkdir -p release
          find armbian-build/output/images \
            -maxdepth 1 -type f -name '*.img' \
            -size +100M -exec cp {} release/ \;

          test -n "$(find release -name '*.img' -print -quit)" \
            || { echo "No IMG produced"; exit 1; }

          cd release
          sha256sum *.img > SHA256SUMS.txt

      - name: Upload flashable image
        uses: actions/upload-artifact@v4
        with:
          name: OJO-PisoWiFi-OrangePi-One-IMG
          path: |
            release/*.img
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
